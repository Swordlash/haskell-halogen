name: CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  EM_VERSION: 3.1.74
  EM_CACHE_FOLDER: 'emsdk-cache'
  # Keep GHCJS_VERSION in step with with-compiler in cabal-ghcjs.project and
  # GHC_VERSION in examples/material/webpack.config-js.js.
  GHCJS_VERSION: '9.12.2'
  CABAL_VERSION: '3.14.1.1'
  # Pin the cabal layout so the store path is the same one the cache step keys on
  # (cabal 3.14 otherwise picks XDG directories).
  CABAL_DIR: /home/runner/.cabal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: '9.12.2'
        cabal-version: '3.14.1.1'
        cabal-update: true

    - name: Configure the build
      run: |
        cabal configure --builddir=dist-newstyle/native --enable-tests --enable-benchmarks --disable-documentation
        cabal build all --builddir=dist-newstyle/native --dry-run

    - name: Restore cached dependencies
      uses: actions/cache/restore@v4
      id: cache
      env:
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json', '**/*.cabal', 'cabal*.project') }}
        restore-keys: ${{ env.key }}-

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: cabal build all --builddir=dist-newstyle/native --only-dependencies

    - name: Save cached dependencies
      uses: actions/cache/save@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: cabal build all --builddir=dist-newstyle/native

    - name: Test
      run: cabal test all --builddir=dist-newstyle/native

  build-js:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup cache
      id: cache-system-libraries
      uses: actions/cache@v4
      with:
        path: ${{env.EM_CACHE_FOLDER}}
        key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}

    - name: Setup EMSDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{env.EM_VERSION}}
        actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

    # Installed through ghcup directly, the way the build-wasm job installs its
    # own cross-compiler. @haskell-org/ghc-installer cannot be used here: its
    # GHC-to-emsdk table hardcodes a single entry, 9.12.1, and hard-exits on
    # anything else, which would pin this repository to that GHC indefinitely.
    - name: Install GHC JavaScript toolchain
      run: |
        curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --silent --show-error https://get-ghcup.haskell.org | \
          BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 sh
        . ~/.ghcup/env
        ghcup config add-release-channel cross
        ghcup install cabal ${{ env.CABAL_VERSION }} --set
        emconfigure ghcup install ghc --set javascript-unknown-ghcjs-${{ env.GHCJS_VERSION }}
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

    - name: Install JavaScript dependencies
      run: npm install

    - name: Update Cabal package index
      run: cabal update

    - name: Cache cabal dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ runner.os }}-ghcjs-${{ env.GHCJS_VERSION }}-cabal-store-${{ hashFiles('**/*.cabal', 'cabal*.project') }}
        restore-keys: |
          ${{ runner.os }}-ghcjs-${{ env.GHCJS_VERSION }}-cabal-store-

    - name: Build
      run: npm run build-js

  build-wasm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install GHC WebAssembly toolchain
      run: |
        mkdir -p "$RUNNER_TEMP/ghc-wasm-meta"
        curl --fail --location --retry 5 https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/358ea50b8496a69da6ce375c0c58bc049dbcb92d/ghc-wasm-meta-358ea50b8496a69da6ce375c0c58bc049dbcb92d.tar.gz | tar xz --strip-components=1 --directory "$RUNNER_TEMP/ghc-wasm-meta"
        SKIP_GHC=1 FLAVOUR=9.14 "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
        . ~/.ghc-wasm/env
        ghcup install cabal 3.14.1.1 --set
        ghcup -s "file://$RUNNER_TEMP/ghc-wasm-meta/ghcup-wasm-0.0.9.yaml" install ghc wasm32-wasi-9.14.1.20260731 --set -- $CONFIGURE_ARGS
        cabal update
        ~/.ghc-wasm/add_to_github_path.sh

    - name: Install JavaScript dependencies
      run: npm install

    - name: Build every example
      run: npm run build-wasm-all
