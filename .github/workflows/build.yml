name: CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  EM_VERSION: 3.1.74
  EM_CACHE_FOLDER: 'emsdk-cache'
  # Keep GHCJS_VERSION in step with with-compiler in cabal-ghcjs.project and
  # GHC_VERSION in examples/material/webpack.config-js.js.
  GHCJS_VERSION: '9.12.2'
  # The native GHC the runner image already ships, so setup is a no-op download.
  GHC_VERSION: '9.14.1'
  # Keep WASM_GHC_VERSION in step with with-compiler in cabal-wasm.project.
  WASM_GHC_VERSION: '9.14.1.20260731'
  GHC_WASM_META_REV: '358ea50b8496a69da6ce375c0c58bc049dbcb92d'
  CABAL_VERSION: '3.16.1.0'
  # Pin the cabal layout so the store is where the cache steps look for it
  # (cabal otherwise picks XDG directories).
  CABAL_DIR: /home/runner/.cabal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ env.GHC_VERSION }}
        cabal-version: ${{ env.CABAL_VERSION }}
        cabal-update: true

    - name: Configure the build
      run: |
        cabal configure --builddir=dist-newstyle/native --enable-tests --enable-benchmarks --disable-documentation
        cabal build all --builddir=dist-newstyle/native --dry-run

    - name: Restore cached dependencies
      uses: actions/cache/restore@v5
      id: cache
      env:
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json', '**/*.cabal', 'cabal*.project') }}
        restore-keys: ${{ env.key }}-

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: cabal build all --builddir=dist-newstyle/native --only-dependencies

    - name: Save cached dependencies
      uses: actions/cache/save@v5
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: cabal build all --builddir=dist-newstyle/native

    - name: Test
      run: cabal test all --builddir=dist-newstyle/native

  build-js:
    runs-on: ubuntu-latest

    # Install the cross-compiler somewhere the runner user owns so it can be
    # cached. The image's own ghcup lives in a root-owned /usr/local/.ghcup.
    env:
      GHCUP_INSTALL_BASE_PREFIX: /home/runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: npm

    - name: Setup cache
      id: cache-system-libraries
      uses: actions/cache@v5
      with:
        path: ${{env.EM_CACHE_FOLDER}}
        key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}

    - name: Setup EMSDK
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{env.EM_VERSION}}
        actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

    - name: Cache GHC JavaScript toolchain
      id: cache-ghcjs
      uses: actions/cache@v5
      with:
        path: ~/.ghcup
        key: ${{ runner.os }}-ghcjs-toolchain-${{ env.GHCJS_VERSION }}-cabal-${{ env.CABAL_VERSION }}-em-${{ env.EM_VERSION }}

    # Uses the ghcup the runner image already ships, the way the build-wasm job
    # installs its own cross-compiler. Do not bootstrap ghcup here: the image
    # puts it in a root-owned /usr/local/.ghcup, so get-ghcup.haskell.org fails
    # trying to chmod the existing binary.
    #
    # @haskell-org/ghc-installer cannot be used either: its GHC-to-emsdk table
    # hardcodes a single entry, 9.12.1, and hard-exits on anything else, which
    # would pin this repository to that GHC indefinitely.
    - name: Install GHC JavaScript toolchain
      if: steps.cache-ghcjs.outputs.cache-hit != 'true'
      run: |
        ghcup config add-release-channel cross
        ghcup install cabal "$CABAL_VERSION" --set
        emconfigure ghcup install ghc --set "javascript-unknown-ghcjs-$GHCJS_VERSION"

    - name: Activate toolchain
      run: echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Update Cabal package index
      run: cabal update

    - name: Cache cabal dependencies
      uses: actions/cache@v5
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ runner.os }}-ghcjs-${{ env.GHCJS_VERSION }}-cabal-store-${{ hashFiles('**/*.cabal', 'cabal*.project') }}
        restore-keys: |
          ${{ runner.os }}-ghcjs-${{ env.GHCJS_VERSION }}-cabal-store-

    - name: Build
      run: npm run build-js

  build-wasm:
    runs-on: ubuntu-latest

    env:
      GHCUP_INSTALL_BASE_PREFIX: /home/runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: npm

    # ~/.ghc-wasm holds wasi-sdk, binaryen and node; ~/.ghcup holds the cross
    # GHC and cabal. Both are needed, so both are keyed together on the pinned
    # ghc-wasm-meta revision and compiler versions.
    - name: Cache GHC WebAssembly toolchain
      id: cache-wasm
      uses: actions/cache@v5
      with:
        path: |
          ~/.ghc-wasm
          ~/.ghcup
        key: ${{ runner.os }}-wasm-toolchain-${{ env.GHC_WASM_META_REV }}-ghc-${{ env.WASM_GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}

    - name: Install GHC WebAssembly toolchain
      if: steps.cache-wasm.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$RUNNER_TEMP/ghc-wasm-meta"
        curl --fail --location --retry 5 "https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/$GHC_WASM_META_REV/ghc-wasm-meta-$GHC_WASM_META_REV.tar.gz" | tar xz --strip-components=1 --directory "$RUNNER_TEMP/ghc-wasm-meta"
        SKIP_GHC=1 FLAVOUR=9.14 "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
        # shellcheck source=/dev/null
        . ~/.ghc-wasm/env
        ghcup install cabal "$CABAL_VERSION" --set
        ghcup -s "file://$RUNNER_TEMP/ghc-wasm-meta/ghcup-wasm-0.0.9.yaml" install ghc "wasm32-wasi-$WASM_GHC_VERSION" --set -- $CONFIGURE_ARGS

    # Runs on a cache hit too: this is what puts the wasm tools on PATH and
    # exports CC/AR/LD and friends for every later step.
    - name: Activate toolchain
      run: |
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
        ~/.ghc-wasm/add_to_github_path.sh

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Update Cabal package index
      run: cabal update

    - name: Cache cabal dependencies
      uses: actions/cache@v5
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ runner.os }}-wasm-${{ env.WASM_GHC_VERSION }}-cabal-store-${{ hashFiles('**/*.cabal', 'cabal*.project') }}
        restore-keys: |
          ${{ runner.os }}-wasm-${{ env.WASM_GHC_VERSION }}-cabal-store-

    - name: Build every example
      run: npm run build-wasm-all
