name: Build & deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  # Keep in step with .github/workflows/build.yml.
  GHC_VERSION: '9.14.1'
  WASM_GHC_VERSION: '9.14.1.20260731'
  GHC_WASM_META_REV: '358ea50b8496a69da6ce375c0c58bc049dbcb92d'
  CABAL_VERSION: '3.16.1.0'
  CABAL_DIR: /home/runner/.cabal

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # The steps every wasm job starts with, the same as build.yml's. This job
    # builds what learn-wasm there builds, so it shares that job's caches of
    # the build directories, and it only restores the store (see the action).
    - name: Set up the wasm toolchain
      uses: ./.github/actions/wasm-toolchain
      with:
        ghc-version: ${{ env.GHC_VERSION }}
        wasm-ghc-version: ${{ env.WASM_GHC_VERSION }}
        ghc-wasm-meta-rev: ${{ env.GHC_WASM_META_REV }}
        cabal-version: ${{ env.CABAL_VERSION }}
        cabal-dir: ${{ env.CABAL_DIR }}
        cache-scope: learn

    # The tutorial's compiler, cached under the same key as in the learn-wasm
    # job in build.yml (see the note there), so that whichever runs first
    # builds it for the other. Keep these three steps in step with those.
    - name: Key the tutorial's rootfs
      id: rootfs-key
      run: |
        key=$(sh toolchain/build-learn-rootfs.sh --key)
        echo "key=${{ runner.os }}-learn-rootfs-$GHC_WASM_META_REV-$key" >> "$GITHUB_OUTPUT"

    - name: Restore the tutorial's rootfs
      id: rootfs-cache
      uses: actions/cache/restore@v5
      with:
        path: dist-newstyle/wasm/learn
        key: ${{ steps.rootfs-key.outputs.key }}

    - name: Build the tutorial's rootfs
      if: steps.rootfs-cache.outputs.cache-hit != 'true'
      run: npm run build-rootfs

    - name: Save the tutorial's rootfs
      if: steps.rootfs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: dist-newstyle/wasm/learn
        key: ${{ steps.rootfs-key.outputs.key }}

    # Before the build, for the base path the site is served under (the
    # repository's name, for a project site): every page the tutorial's
    # prerender writes, and every link in it, starts with it, and the page
    # finds its compiler at rootfs/ under it.
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build every example
      run: npm run build-wasm-all
      env:
        HALOGEN_BASE_PATH: ${{ steps.pages.outputs.base_path }}

    # Every example's script, stylesheet and binary, raw, gzipped and with
    # brotli, in the log and the job summary, so that a change in what a
    # reader downloads shows. Only reported (--no-write): GitHub Pages
    # compresses on the fly, so precompressed copies would only weigh down
    # the upload, and the rootfs' archives are compressed already. Here rather
    # than in build-wasm-all.sh, so that a pull request's build does not spend
    # the minute it takes.
    - name: Report the sizes
      run: |
        public_dir=dist-newstyle/wasm/public
        # shellcheck disable=SC2046
        node toolchain/compress.mjs --no-write \
          $(find "$public_dir" -mindepth 2 -path "$public_dir/learn/rootfs" -prune -o -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' \) -print | sort)

    # The same browser test as the learn-wasm job in build.yml, run here too
    # because the two workflows run side by side on a push to master: without
    # it, a tutorial that fails there would still be deployed from here.
    - name: Cache Chromium
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    # Without --with-deps: the runner image already has every library the
    # headless shell needs (apt reported each one installed), and what
    # --with-deps added besides, fonts and an xvfb upgrade, the tests do not
    # use, while its apt fetch from the mirror has taken eleven minutes.
    - name: Install Chromium
      run: npx playwright install --only-shell chromium

    - name: Test the tutorial in a browser
      run: npm run test-learn
      env:
        HALOGEN_BASE_PATH: ${{ steps.pages.outputs.base_path }}

    # Only the tutorial, with its compiler in rootfs/: the other examples are
    # built to check that they still link, and are served on their own by
    # npm run serve-wasm.
    - name: Upload the tutorial to GH Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist-newstyle/wasm/public/learn

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
