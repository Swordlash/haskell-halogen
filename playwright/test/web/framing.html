<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A program in a frame</title></head>
<body>
  <!-- A page with no program of its own around a frame that has one
       (program.html plays a program's side of the probe): what is done to
       an element in the frame is the frame's program's to handle. -->
  <iframe id="inner" title="The program" src="program.html"></iframe>
</body>
</html>
