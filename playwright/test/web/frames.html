<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Frames</title></head>
<body>
  <!-- A page with frames, as a page of interactive SVGs has: one framed
       document of the site's, sandboxed with scripts only, and one that
       navigates itself elsewhere. -->
  <iframe class="flame" title="Where the time goes" sandbox="allow-scripts" src="framed.html?interactive"></iframe>
  <iframe class="wanderer" sandbox="allow-scripts" src="framed.html?wander"></iframe>
</body>
</html>
