indentation: 2
function-arrows: leading
comma-style: leading
import-export-style: leading
indent-wheres: true
record-brace-space: true
newlines-between-decls: 1
haddock-style: single-line
haddock-style-module:
let-style: inline
in-style: right-align
respectful: false
# The router's codec-list operators (Halogen.Router.Duplex.Generic), which
# fourmolu cannot see the fixities of from a module that only imports them.
fixities: ["infix 7 .=", "infixr 5 .|"]
unicode: never
